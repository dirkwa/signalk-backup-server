name: Publish container image

# Triggers on semver tag push (vX.Y.Z, optionally with -beta./-rc.
# suffix). The tag drives both the version label and the published
# image tag. We push a multi-arch manifest list so a single tag (e.g.
# `:0.1.0` or `:latest`) resolves to the right arch automatically on
# the puller's host. amd64 builds natively, arm64 under QEMU emulation
# (fine for our small image — slow part is npm/tsc which is
# arch-independent).
#
# Tag glob is intentionally tight ('v[0-9]*.[0-9]*.[0-9]*') so stray
# tags like `vendor-fix` or `vnext` don't trigger a publish. Prerelease
# suffixes still match (the glob looks at the leading digits only).

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]
  # release-please dispatches this at the tag it creates, since a tag pushed
  # with GITHUB_TOKEN starts no workflow. The version always comes from the tag.
  workflow_dispatch:

jobs:
  # Image push runs first. The Release job below depends on it via
  # `needs: publish` so we never tag a Release whose corresponding image
  # didn't make it to the registry.
  publish:
    # A dispatch can name any ref; only a release tag is published.
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/signalk-backup-server
    steps:
      # The trigger glob is loose (it lets `v01.0.0` and `v1.0.0.0` through),
      # and a dispatch can run at any tag. Validate the version against strict
      # semver before doing anything publishable.
      - name: Validate tag is semver
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Version '${VERSION}' is not valid semver X.Y.Z[-prerelease][+build]"
            exit 1
          fi

      - uses: actions/checkout@v7

      - name: Resolve version + tags
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

          # Build the image tag list. Stable releases get :VERSION + :latest;
          # prereleases (any prerelease suffix: -beta.1, -rc.1, -alpha.1, …)
          # get :VERSION only, so a prerelease push never overwrites the
          # stable :latest pointer. Strip +build metadata before testing —
          # semver allows hyphens inside it (1.2.3+build-1 is stable).
          CORE="${VERSION%%+*}"
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          {
            echo 'tags<<EOF'
            echo "${IMAGE}:${VERSION}"
            if [[ "${CORE}" != *-* ]]; then
              echo "${IMAGE}:latest"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

          echo "Publishing version: ${VERSION}"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push (amd64 + arm64 manifest)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.version.outputs.tags }}
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
          provenance: false

  # GitHub Release with auto-generated notes (categorised via
  # .github/release.yml). Tag-triggered only — workflow_dispatch
  # publishes the image but does not create a Release (no tag context).
  # Gated on the publish job so a failed image push won't leave a
  # Release pointing at a missing image.
  release:
    needs: publish
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Same rule as the :latest decision above: prerelease iff the semver
      # core (build metadata stripped) carries a -suffix.
      - name: Classify prerelease
        id: classify
        run: |
          CORE="${GITHUB_REF_NAME#v}"
          CORE="${CORE%%+*}"
          if [[ "${CORE}" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.classify.outputs.prerelease }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
